name: CI

# Everything here runs with no third-party dependencies — there is no install step
# because WiseTalk's executable layer is Python standard library only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Skill + pipeline tests
        run: python -m unittest discover tests -v

      - name: Skills-library drift gate
        # The library is canonical; each agent carries a byte-identical copy.
        # A drifted copy means an agent is running a stale skill — fail the build.
        run: python skills-library/sync.py --verify

      - name: End-to-end pipeline demo
        # Exits non-zero if any scenario deviates from its declared expectations.
        run: python demo.py
        env:
          NO_COLOR: "1"

      - name: Browser demo boots and serves
        run: |
          python demo_server.py --port 8000 --no-browser &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8000/ && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/
          curl -sf http://127.0.0.1:8000/api/models | python -c "import json,sys; assert len(json.load(sys.stdin)['models']) == 8"
          # The KPI strip and the corpus panel are computed, not hardcoded — so CI
          # holds them to the same figures METRICS.md publishes.
          curl -sf http://127.0.0.1:8000/api/metrics | python -c "import json,sys; m=json.load(sys.stdin); assert m['models']==8 and m['use_cases']==32 and m['skills']==9 and m['dependencies']==0, m"
          curl -sf http://127.0.0.1:8000/api/corpus | python -c "import json,sys; c=json.load(sys.stdin); assert c['attack']['blocked']==28 and c['attack']['total']==28, c; assert c['benign']['blocked']==0 and c['benign']['total']==24, c"

      - name: Demo run leaves the repository clean
        # The tracked battle-scores seed is evidence from a real E2E run. Session
        # battles belong in the gitignored runs/ directory, never back into it.
        run: |
          python demo.py > /dev/null
          git diff --exit-code
        env:
          NO_COLOR: "1"
